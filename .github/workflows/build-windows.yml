name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r Python/requirements.txt

      - name: Generate icon
        run: python Python/create_icon.py

      - name: Build EXE with PyInstaller
        run: >
          pyinstaller
          --noconfirm
          --windowed
          --onefile
          --name "CH340 Relay Controller"
          --icon Python/relay_icon.ico
          --hidden-import serial.tools.list_ports
          --hidden-import serial.tools.list_ports_win32
          Python/relay_controller.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CH340-Relay-Controller-Windows
          path: dist/CH340 Relay Controller.exe
          if-no-files-found: error
